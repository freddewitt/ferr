name: CI

on:
  push:
    branches: ["main", "dev"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Tests unitaires + intégration (matrix multi-OS)
  # ─────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-13, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install par2cmdline (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y par2

      - name: Install par2cmdline (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install par2

      - name: Install par2cmdline (macOS 13)
        if: matrix.os == 'macos-13'
        run: brew install par2

      - name: Install par2cmdline (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install par2 -y
        continue-on-error: true

      - name: Build
        run: cargo build --workspace

      - name: Clippy (warnings as errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Tests PAR2 intégration
        run: cargo test -p ferr-par2 -- --include-ignored
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────
  # Vérification du format
  # ─────────────────────────────────────────────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ─────────────────────────────────────────────────────────────────
  # Audit des dépendances (RUSTSEC)
  # ─────────────────────────────────────────────────────────────────
  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit
        run: cargo audit

  # ─────────────────────────────────────────────────────────────────
  # Release — déclenché sur tag v*
  # Construit les binaires sur chaque OS, les empaquette et les publie
  # ─────────────────────────────────────────────────────────────────
  release:
    name: Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, fmt, audit]
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: ferr
            archive: ferr-linux-x86_64.tar.gz
            bundle_ext: "AppImage"
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: ferr
            archive: ferr-macos-aarch64.tar.gz
            bundle_ext: "dmg"
          - os: macos-13
            target: x86_64-apple-darwin
            binary: ferr
            archive: ferr-macos-x86_64.tar.gz
            bundle_ext: "dmg"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: ferr.exe
            archive: ferr-windows-x86_64.zip
            bundle_ext: "msi"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.1.0 --locked

      - name: Build CLI release
        run: cargo build --release --target ${{ matrix.target }} -p ferr-cli

      - name: Build GUI release
        run: |
          cd ferr-app
          cargo tauri build --target ${{ matrix.target }} --no-sign

      - name: Package (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          # Package CLI
          cd target/${{ matrix.target }}/release
          tar czf ${{ github.workspace }}/${{ matrix.archive }} ${{ matrix.binary }}
          
          # Find and Move GUI Bundle
          cd ${{ github.workspace }}
          find ferr-app/target/${{ matrix.target }}/release/bundle -name "*.${{ matrix.bundle_ext }}" -exec mv {} ./ferr-gui-${{ matrix.target }}.${{ matrix.bundle_ext }} \;

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Package CLI
          Compress-Archive `
            -Path "target/${{ matrix.target }}/release/${{ matrix.binary }}" `
            -DestinationPath "${{ matrix.archive }}"
          
          # Find and Move GUI Bundle
          $bundle = Get-ChildItem -Path "ferr-app/target/${{ matrix.target }}/release/bundle" -Recurse -Filter "*.${{ matrix.bundle_ext }}" | Select-Object -First 1
          if ($bundle) {
            Move-Item -Path $bundle.FullName -Destination "./ferr-gui-${{ matrix.target }}.${{ matrix.bundle_ext }}"
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.archive }}
            ferr-gui-*.*
          generate_release_notes: true
          fail_on_unmatched_files: false
